<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authors | Sajilo Library</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/authors.css">

</head>

<body>

    <header class="navbar">

        <div class="container">

            <div class="logo">

                <i class="fa-solid fa-book-open"></i>

                <h2>Sajilo Library</h2>

            </div>

            <nav>

                <ul class="nav-links">

                    <li><a href="index.html">Dashboard</a></li>

                    <li><a href="books.html">Books</a></li>

                    <li><a href="authors.html" class="active">Authors</a></li>

                    <li><a href="genres.html">Genres</a></li>

                </ul>

            </nav>

            <div class="admin-profile">

                <i class="fa-solid fa-circle-user"></i>

                <span>Admin</span>

            </div>

        </div>

    </header>


    <main>

        <section class="authors-page">

            <div class="container">

                
                <div class="page-header">

                    <div>

                        <h1>Authors</h1>

                        <p>Manage all authors in your library.</p>

                    </div>

                    <a href="author-form.html" class="add-btn">

                        <i class="fa-solid fa-plus"></i>

                        Add Author

                    </a>

                </div>

                

                <div class="toolbar">

                    <div class="search-box">

                        <input type="text" placeholder="Search authors...">

                        <button>

                            <i class="fa-solid fa-magnifying-glass"></i>

                        </button>

                    </div>

                </div>

            

                <div class="table-card">

                    <table>

                        <thead>

                            <tr>

                                <th>Name</th>

                                <th>Nationality</th>

                                <th>Total Books</th>

                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr>

                                <td>James Clear</td>

                                <td>American</td>

                                <td>5</td>

                                <td>

                                    <a href="author-form.html" class="action-btn">

                                        Edit

                                    </a>

                                </td>

                            </tr>

                            <tr>

                                <td>Paulo Coelho</td>

                                <td>Brazilian</td>

                                <td>9</td>

                                <td>

                                    <a href="author-form.html" class="action-btn">

                                        Edit

                                    </a>

                                </td>

                            </tr>

                            <tr>

                                <td>Robert C. Martin</td>

                                <td>American</td>

                                <td>4</td>

                                <td>

                                    <a href="author-form.html" class="action-btn">

                                        Edit

                                    </a>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
