<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up | Sajilo Library</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/signup.css" />
  </head>

  <body>
    <main class="signup-page">
      <section class="signup-intro">
        <div class="intro-content">
          <div class="brand-icon">
            <i class="fa-solid fa-book-open"></i>
          </div>

          <h1>Sajilo Library</h1>

          <p class="intro-text">
            Simple library management for books, authors, and genres.
          </p>

          <div class="features">
            <div class="feature">
              <div class="feature-icon">
                <i class="fa-solid fa-book"></i>
              </div>

              <span>Manage Books</span>
            </div>

            <div class="feature">
              <div class="feature-icon">
                <i class="fa-solid fa-user-pen"></i>
              </div>

              <span>Manage Authors</span>
            </div>

            <div class="feature">
              <div class="feature-icon">
                <i class="fa-solid fa-tags"></i>
              </div>

              <span>Organize Genres</span>
            </div>

            <div class="feature">
              <div class="feature-icon">
                <i class="fa-solid fa-boxes-stacked"></i>
              </div>

              <span>Track Inventory</span>
            </div>
          </div>

          <p class="tagline">Organize knowledge. Simplify management.</p>
        </div>
      </section>

      <section class="signup-section">
        <div class="signup-card">
          <div class="signup-header">
            <h2>Create Account</h2>

            <p>Sign up to start managing your digital library.</p>
          </div>

          <form>
            <div class="form-group">
              <label for="fullname">Full Name</label>

              <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required
              />
            </div>

            <div class="form-group">
              <label for="username">Username</label>

              <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email</label>

              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>

              <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
              />
            </div>

            <div class="form-group">
              <label for="confirm-password"> Confirm Password </label>

              <input
                type="password"
                id="confirm-password"
                placeholder="Confirm your password"
                required
              />
            </div>

            <div class="terms">
              <label>
                <input type="checkbox" required />

                <span>
                  I agree to the
                  <a href="#">Terms & Conditions</a>
                </span>
              </label>
            </div>

            <button type="submit" class="signup-btn">Create Account</button>
          </form>

          <div class="login-link">
            <span>Already have an account?</span>

            <a href="login.html">Login</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
