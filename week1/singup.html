<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Croissant+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <h1>User Registration</h1>
    <div id ="details">
    <h2>Personal Details</h2>
    <form>
      <div>
        <label> First Name: </label>
        <input type="text" />
      </div>

      <div>
        <label> Last Name: </label>
        <input type="text" />
      </div>

      <div>
        <label> Age: </label>
        <input type="number" />
      </div>

      <div>
        <label> Gender: </label>
        <select>
          <option selected>Male</option>
          <option>Female</option>
          <option>Prefer not to say</option>
        </select>
      </div>

      <div>
        <label> Profile picture:</label>
        <button id="one">Browse...</button>  <p>No files selected..</p>
      </div>
      </div>

      <div id = "account">
      <h2>Account Details</h2>

      <div>
        <label> Email:</label>
        <input type="email" />
      </div>

      <div>
        <label> Password: </label>
        <input type="password" />
      </div>

      <div>
        <label> Role: </label>
        <input type="radio" />
        <label> Admin</label>
        <input type="radio" />
        <label> User </label>
        <div>
          <input type="checkbox" /> I agree with all the terms and conditions.
        </div>
        <div>
          <button id="two">Register</button>
          <button id="three">Reset</button>
        </div>
      </div>
      </div>
    </form>
  </body>
  <footer>© 2026 My toollist. All rights reserved.</footer>
</html>
