<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Book | Sajilo Library</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/forms.css" />
  </head>

  <body>

    <header class="navbar">
      <div class="container">
        <div class="logo">
          <i class="fa-solid fa-book-open"></i>

          <h2>Sajilo Library</h2>
        </div>

        <nav>
          <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>

            <li><a href="books.html" class="active">Books</a></li>

            <li><a href="authors.html">Authors</a></li>

            <li><a href="genres.html">Genres</a></li>
          </ul>
        </nav>

        <div class="admin-profile">
          <i class="fa-solid fa-circle-user"></i>

          <span>Admin</span>
        </div>
      </div>
    </header>

    

    <main class="form-page">
      <div class="container">
        <a href="books.html" class="back-link">
          <i class="fa-solid fa-arrow-left"></i>

          Back to Books
        </a>

        <div class="page-title">
          <h1>Add New Book</h1>

          <p>Fill in the details below to add a new book to the library.</p>
        </div>

        <div class="form-card">
          <form>
            <div class="form-group">
              <label>Book Title</label>

              <input type="text" placeholder="Enter book title" />
            </div>

            <div class="form-group">
              <label>Author</label>

              <select>
                <option>Select Author</option>

                <option>James Clear</option>

                <option>Robert C. Martin</option>

                <option>Paulo Coelho</option>
              </select>
            </div>

            <div class="form-group">
              <label>Genre</label>

              <select>
                <option>Select Genre</option>

                <option>Technology</option>

                <option>Novel</option>

                <option>Self Help</option>
              </select>
            </div>

            <div class="form-group">
              <label>Stock Quantity</label>

              <input type="number" placeholder="Enter stock quantity" />
            </div>

            <div class="form-group">
              <label>Book Cover</label>

              <input type="file" />
            </div>

            <div class="form-group">
              <label>Description</label>

              <textarea
                rows="6"
                placeholder="Write a short description..."
              ></textarea>
            </div>

            <div class="form-buttons">
              <button type="submit" class="save-btn">
                <i class="fa-solid fa-floppy-disk"></i>

                Save Book
              </button>

              <a href="books.html" class="cancel-btn"> Cancel </a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
